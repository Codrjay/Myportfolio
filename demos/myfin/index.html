<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="MyFin demo: personal finance tracker with sample data."><meta name="theme-color" content="#0E1F47"><link rel="icon" href="icons/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>MyFin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app. Floating pill menu under 860px, left rail above it. Landing = light hero with a live phone render of the real home screen. */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#0B1324; --muted:#5E6A80; --faint:#8A94A7;
  --line:#E6EAF1; --soft:#EEF1F6; --navy:#0E1F47; --navy-2:#173070; --on-navy:#FFFFFF;
  --blue:#2A5BFF; --blue-ink:#1D44D6; --blue-tint:#E9EEFF; --blue-line:#B9C8FF;
  --butter:#FFDF6E; --butter-ink:#3A2E00; --pos:#0F8F57; --neg:#D14343; --warn:#C27A00; --alert:#F2613F;
  --shadow:0 1px 2px rgba(11,19,36,.04),0 8px 24px rgba(11,19,36,.06);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080D18; --card:#111A2B; --ink:#EEF2FA; --muted:#9AA6BC; --faint:#6F7B92;
  --line:#1F2A3F; --soft:#1A2437; --navy:#14275A; --navy-2:#1E3880; --on-navy:#FFFFFF;
  --blue:#5B82FF; --blue-ink:#8AA6FF; --blue-tint:#16224A; --blue-line:#2C3F7E;
  --butter:#FFDF6E; --butter-ink:#3A2E00; --pos:#3DC387; --neg:#F07171; --warn:#F0B246; --alert:#FF7A57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080D18; --card:#111A2B; --ink:#EEF2FA; --muted:#9AA6BC; --faint:#6F7B92;
  --line:#1F2A3F; --soft:#1A2437; --navy:#14275A; --navy-2:#1E3880; --on-navy:#FFFFFF;
  --blue:#5B82FF; --blue-ink:#8AA6FF; --blue-tint:#16224A; --blue-line:#2C3F7E;
  --butter:#FFDF6E; --butter-ink:#3A2E00; --pos:#3DC387; --neg:#F07171; --warn:#F0B246; --alert:#FF7A57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.dec{opacity:.45;font-weight:600}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-ink)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn-block{width:100%}
.link{color:var(--blue);font-weight:700;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill-pos{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.pill-neg{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.pill-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill-blue{background:var(--blue-tint);color:var(--blue-ink)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- landing ---------- */
.lp{min-height:100%;background:var(--bg)}
.lp-wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lp-nav{display:flex;align-items:center;justify-content:space-between;height:76px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.lp-nav nav{display:flex;gap:28px;font-weight:600;font-size:14px;color:var(--muted)}
.lp-nav nav a:hover{color:var(--ink)}
.lp-nav .actions{display:flex;gap:10px;align-items:center}
.lp-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:40px 72px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--blue-ink);background:var(--blue-tint);padding:6px 12px;border-radius:999px}
.lp-hero h1{font-size:clamp(40px,6vw,68px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin-top:22px}
.lp-hero h1 span{color:var(--blue)}
.lp-hero .lede{font-size:18px;color:var(--muted);max-width:520px;margin-top:20px;line-height:1.55}
.lp-hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.lp-hero .ticks{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:28px;color:var(--muted);font-size:14px;font-weight:600;padding:0;list-style:none}
.lp-hero .ticks li{display:flex;align-items:center;gap:8px}
.lp-hero .ticks svg{color:var(--pos)}
.stage{position:relative;display:flex;justify-content:center;min-height:620px}
.phone{position:relative;width:340px;height:690px;border-radius:52px;background:var(--ink);padding:10px;box-shadow:0 40px 80px -20px rgba(14,31,71,.35),0 10px 30px rgba(14,31,71,.12)}
.phone-screen{width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--bg);position:relative}
.phone-scale{width:390px;transform:scale(.8205);transform-origin:top left;pointer-events:none}
.float-card{position:absolute;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;border:1px solid var(--line)}
.fc-1{left:-10px;top:470px;width:210px}
.fc-2{right:-6px;top:300px;width:220px}
@media (prefers-reduced-motion:no-preference){.fc-1{animation:bob 7s ease-in-out infinite}.fc-2{animation:bob 8s ease-in-out -3s infinite}}
@keyframes bob{50%{transform:translateY(-8px)}}
.lp-band{background:var(--card);border-block:1px solid var(--line)}
.lp-q{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.lp-q > div{padding:32px 24px;border-left:1px solid var(--line)}
.lp-q > div:first-child{border-left:0}
.lp-q h3{font-size:18px;letter-spacing:-.01em;margin-top:14px}
.lp-q p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.55}
.qi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-tint);color:var(--blue-ink)}
.lp-sec{padding-block:88px}
.lp-sec h2{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.08;font-weight:800;max-width:640px}
.lp-sec .sub{color:var(--muted);font-size:17px;max-width:560px;margin-top:14px;line-height:1.55}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:44px}
.feat-card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:18px}
.feat-card h3{font-size:18px;letter-spacing:-.01em}
.feat-card p{color:var(--muted);font-size:14px;line-height:1.55;margin-top:6px}
.feat-demo{background:var(--bg);border-radius:var(--r-md);padding:16px;min-height:172px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.lp-dark{background:var(--navy);color:var(--on-navy);border-radius:32px;padding:56px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.lp-dark h2{color:var(--on-navy)}
.lp-dark .sub{color:rgba(255,255,255,.72)}
.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px}
.stat b{display:block;font-size:30px;letter-spacing:-.02em}
.stat span{font-size:13px;color:rgba(255,255,255,.7)}
.lp-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:36px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:88px}

/* ---------- login ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding-block:48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-inner{width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.auth h1{font-size:32px;letter-spacing:-.03em;font-weight:800}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:700}
.input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:15px;width:100%}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-tint)}
.demo-box{border:1.5px dashed var(--blue-line);background:var(--blue-tint);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.demo-box small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.demo-box b{font-size:14px}
.err{color:var(--neg);font-size:13px;font-weight:600;min-height:18px}
.auth-art{background:var(--navy);color:var(--on-navy);display:flex;flex-direction:column;justify-content:space-between;padding:48px;position:relative;overflow:hidden}
.auth-art .quote{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;max-width:420px}
.auth-art .meta{color:rgba(255,255,255,.7);font-size:14px;margin-top:14px}
.ring-art{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05)}
.ring-art.b{right:auto;left:-160px;top:auto;bottom:-200px;width:480px;height:480px;border-color:rgba(255,223,110,.08)}

/* ---------- app shell: a phone app everywhere. Full screen on phones, a framed device on wide screens ---------- */
.stagebg{min-height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding-block:24px;padding-left:24px;padding-right:24px}
.device{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.screen .view{padding:0 18px 140px;container-type:inline-size}
.view{container-type:inline-size}
.view.enter{animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.side{display:none;width:256px;flex:none;background:var(--card);border-right:1px solid var(--line);flex-direction:column;padding:22px 14px 18px;overflow-y:auto}
.side .brand{padding:4px 10px 18px}
.side-add{margin:0 4px 8px}
.side-group{margin-top:14px}
.side-group p{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 12px 6px}
.side-group a{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--muted);font-size:14px;transition:background .15s,color .15s}
.side-group a:hover{background:var(--soft);color:var(--ink)}
.side-group a[aria-current="page"]{background:var(--blue-tint);color:var(--blue-ink)}
.side .me{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:6px}
.side .me-card{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--soft)}
.side .me-card div{flex:1;min-width:0}
.side .me-card b{display:block;font-size:14px}
.side .me-card span{font-size:12px;color:var(--muted)}
.side .me button.lnk{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);text-align:left}
.side .me button.lnk:hover{background:var(--soft);color:var(--ink)}
@media (min-width:861px){
  .stagebg{display:flex;align-items:stretch;justify-content:flex-start;gap:0;padding:0;height:100vh;height:100dvh;min-height:0}
  .device{flex:1;width:auto;height:auto;min-width:0}
  .side{display:flex}
  .stagebg .bnav,.stagebg .fade{display:none}
  .screen .view{max-width:1140px;margin:0 auto;padding:0 32px 64px}
  .screen .top{margin:0 -32px 18px;padding:26px 32px 14px}
  .scrim{align-items:center}
  .sheet{border-radius:28px;max-width:480px;padding-bottom:24px}
  .toast{bottom:32px}
}
@media (max-width:860px){.stagebg{display:block;padding:0}}
.bnav{position:absolute;left:14px;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:66px;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:0 12px 30px rgba(11,19,36,.12);z-index:30;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--faint);min-width:54px;-webkit-tap-highlight-color:transparent}
.bnav a .pi{display:grid;place-items:center;width:48px;height:30px;border-radius:999px;transition:background .2s}
.bnav a[aria-current="page"]{color:var(--ink)}
.bnav a[aria-current="page"] .pi{background:var(--blue-tint);color:var(--blue-ink)}
.bnav .add{width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 40%,transparent);transition:transform .15s}
.bnav .add:active{transform:scale(.92)}
.fade{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to top,var(--bg) 40%,transparent);pointer-events:none;z-index:20}
.screen .top{position:sticky;top:0;z-index:8;background:var(--bg);margin:0 -18px 14px;padding:16px 18px 12px}
.screen .top.scrolled{box-shadow:0 1px 0 var(--line)}
.tools{display:flex;gap:8px;align-items:center}
.row,.qa button,.chip,.card.tap{transition:transform .12s ease,background .15s}
.row:active,.chip:active,.card.tap:active{transform:scale(.985)}
.qa button:active .c{transform:scale(.92)}
button.row{background:none;font:inherit;color:inherit;cursor:pointer}
button.row:hover{background:var(--soft)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top .avatar{cursor:pointer}
.top h1{font-size:24px;letter-spacing:-.025em;font-weight:800}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--butter);font-weight:800;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--blue-line)}
.hello small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.hello b{font-size:18px;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--alert);box-shadow:0 0 0 2px var(--card)}

.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line)}
.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h2,.sec-h h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 12px}

/* balance card */
.bal{background:var(--navy);color:var(--on-navy);border-radius:var(--r-lg);padding:22px 20px 18px;position:relative;overflow:hidden}
.bal::after{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.05);pointer-events:none}
.bal-label{text-align:center;font-size:13px;color:rgba(255,255,255,.7);font-weight:600}
.bal-amt{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.bal-amt .v{font-size:34px;font-weight:800;letter-spacing:-.03em}
.bal-amt button{color:rgba(255,255,255,.7);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.bal-amt button:hover{background:rgba(255,255,255,.08)}
.bal-delta{text-align:center;margin-top:4px;font-size:13px;color:rgba(255,255,255,.75)}
.bal-delta b{color:var(--butter)}
.strip{margin-top:18px;border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.05);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.strip .si{width:40px;height:40px;border-radius:12px;background:rgba(255,223,110,.14);color:var(--butter);display:grid;place-items:center}
.strip div{flex:1;min-width:0}
.strip small{display:block;font-size:12px;color:rgba(255,255,255,.7)}
.strip b{font-size:16px;letter-spacing:.01em}
.strip .go{height:34px;padding:0 14px;border-radius:999px;background:var(--butter);color:var(--butter-ink);font-weight:800;font-size:13px}

.qa{display:grid;grid-template-columns:repeat(3,1fr);padding:18px 8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:13px}
.qa .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;transition:transform .15s}
.qa button:hover .c{transform:translateY(-2px)}
.qa .c svg{width:24px;height:24px}

.promo{position:relative;min-height:112px;gap:10px;border-radius:var(--r-lg);background:var(--blue-tint);border:1px solid var(--blue-line);padding:16px 18px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.promo small{font-size:12px;font-weight:700;color:var(--blue-ink)}
.promo h3{font-size:16px;font-weight:800;line-height:1.25;max-width:60%;letter-spacing:-.01em}
.promo .btn-sm{height:30px;padding:0 13px;font-size:12px;align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:999px;font-weight:700}
.promo .btn-sm.done{background:var(--pos);color:#fff}
.big3d{position:absolute;right:16px;top:50%;transform:translateY(-50%) rotate(-8deg);font-size:56px;font-weight:800;letter-spacing:-.05em;color:var(--blue);line-height:1;
  text-shadow:1px 1px 0 var(--blue-ink),2px 2px 0 var(--blue-ink),3px 3px 0 var(--blue-ink),4px 4px 0 var(--navy),6px 8px 14px rgba(14,31,71,.25)}
.big3d small{font-size:28px;color:inherit;font-weight:800;letter-spacing:0;margin-left:2px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.ic{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--muted)}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.amt.in{color:var(--pos)}
.day-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:22px 4px 8px}

.bar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--blue);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar i.warn{background:var(--warn)}
.bar i.over{background:var(--neg)}
.bud{display:flex;flex-direction:column;gap:8px}
.bud-top{display:flex;justify-content:space-between;gap:4px 8px;font-size:14px;flex-wrap:wrap}
.bud-top b{font-weight:700}
.bud-top span{color:var(--muted);font-size:13px}

.home-grid{display:flex;flex-direction:column;gap:22px}
.home-a,.home-b{display:flex;flex-direction:column;gap:22px;min-width:0}
.home-b{display:none}
@container (min-width:760px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
  .home-b{display:flex}
  .home-a .recent-mob{display:none}
}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@container (max-width:760px){.grid3{grid-template-columns:1fr}.grid2.st{grid-template-columns:1fr}}
.kpi{padding:18px 20px}
.kpi small{font-size:13px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;margin-top:4px}

.goal{padding:20px;display:flex;flex-direction:column;gap:14px}
.goal-h{display:flex;align-items:center;gap:12px}
.goal-h .ic{background:var(--blue-tint);color:var(--blue-ink)}
.goal-h div{flex:1;min-width:0}
.goal-h b{display:block;font-size:16px}
.goal-h span{font-size:13px;color:var(--muted)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800}

.tabs{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;padding-bottom:2px}

.chal{padding:20px;display:flex;flex-direction:column;gap:14px}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:10px;border-radius:999px;background:var(--soft)}
.dots i.on{background:var(--blue)}
.dots i.today{background:var(--butter)}

.book{display:flex;gap:18px;padding:20px}
.cover{width:84px;height:122px;border-radius:8px 12px 12px 8px;flex:none;background:var(--navy);color:#fff;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;font-weight:800;font-size:12px;line-height:1.2;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),var(--shadow)}
.cover.y{background:var(--butter);color:var(--butter-ink)}
.cover.b{background:var(--blue)}
.cover small{font-weight:600;font-size:10px;opacity:.8}
.streak{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.streak svg{color:var(--alert)}
textarea.input{height:96px;padding:12px 16px;resize:vertical}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--font);font-weight:600}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(8,13,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:94%;overflow-y:auto}
.scrim.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.amt-in{display:flex;align-items:center;justify-content:center;gap:4px;padding:18px 0 8px}
.amt-in span{font-size:34px;font-weight:800;color:var(--faint)}
.amt-in input{border:0;background:none;font-size:44px;font-weight:800;letter-spacing:-.03em;width:1.4ch;min-width:1.4ch;max-width:80%;text-align:left;outline:none}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.form-stack{display:flex;flex-direction:column;gap:16px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 22px,calc(100% - 16px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.toast{white-space:nowrap;max-width:92%;position:absolute;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:.25s;display:flex;align-items:center;gap:8px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.notif{position:absolute;right:0;top:54px;width:320px;max-width:calc(100vw - 36px);z-index:40;box-shadow:var(--shadow)}
.rel{position:relative}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}

@media (max-width:980px){
  .lp-hero{grid-template-columns:1fr;gap:24px}
  .lp-q{grid-template-columns:repeat(2,1fr)}
  .lp-q > div:nth-child(3){border-left:0}
  .lp-q > div:nth-child(n+3){border-top:1px solid var(--line)}
  .feat{grid-template-columns:minmax(0,1fr)}
  .lp-dark{grid-template-columns:1fr;padding:32px 24px}
  .lp-nav nav{display:none}
}
@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth-art{display:none}

/* keypad, tour, video */
.amt-display{display:flex;align-items:baseline;justify-content:center;gap:4px;padding:14px 0 4px;font-weight:800;letter-spacing:-.03em}
.amt-display span{font-size:30px;color:var(--faint)}
.amt-display b{font-size:46px}
.amt-display b.zero{color:var(--faint)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:46px;border-radius:16px;background:var(--soft);font-size:22px;font-weight:700;display:grid;place-items:center;transition:transform .1s,background .15s}
.keypad button:active{transform:scale(.95);background:var(--line)}
.tour{position:fixed;inset:0;z-index:80}
.tour-spot{position:absolute;border-radius:24px;box-shadow:0 0 0 2px var(--butter),0 0 0 2400px rgba(6,10,20,.74);transition:all .38s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour-card{position:absolute;background:var(--card);border-radius:22px;padding:18px 18px 14px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:top .38s cubic-bezier(.2,.8,.2,1),left .38s cubic-bezier(.2,.8,.2,1),opacity .2s}
.tour-card h3{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.tour-card p{font-size:14px;color:var(--muted);line-height:1.5;margin-top:6px}
.tour-step{font-size:12px;font-weight:700;color:var(--blue-ink)}
.tour-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.tour-dots{display:flex;gap:5px}
.tour-dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:all .2s}
.tour-dots i.on{width:18px;background:var(--blue)}
.tour-hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:24px}
.tour-hero .tour-card{position:relative;width:100%;max-width:400px;margin:0 auto;text-align:center;padding:28px 22px 18px}
.tour-hero .wave{width:64px;height:64px;border-radius:20px;background:var(--navy);display:grid;place-items:center;margin:0 auto 8px}
.tour-hero .wave svg{width:34px;height:34px}
.lp-video{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center}
.vid-phone{width:320px;max-width:100%;aspect-ratio:390/844;border-radius:46px;background:#0B1324;padding:9px;box-shadow:0 40px 80px -20px rgba(14,31,71,.35)}
.vid-phone video{width:100%;height:100%;border-radius:38px;display:block;background:var(--bg);object-fit:cover}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:28px;padding:0;list-style:none}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps b{display:block;font-size:15px}
.steps span.n{width:30px;height:30px;border-radius:50%;background:var(--blue-tint);color:var(--blue-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}

@media (max-width:760px){.lp .grid2.st{grid-template-columns:minmax(0,1fr)}}

const acct=id=>S.accounts.find(a=>a.id===id);

const cash=()=>S.accounts.reduce((s,a)=>s+acctNaira(a),0);
const assets=()=>cash()+S.invest.reduce((s,x)=>s+x.bal,0);
const debt=()=>S.debts.reduce((s,x)=>s+x.bal,0);
const netWorth=()=>assets()-debt();
const monthTx=()=>S.txns.filter(t=>(Date.now()-new Date(t.date))/864e5<30);
const spentIn=cat=>monthTx().filter(t=>t.t==='out'&&t.cat===cat).reduce((s,t)=>s+t.amt,0);
const totIn=()=>monthTx().filter(t=>t.t==='in').reduce((s,t)=>s+t.amt,0);
const totOut=()=>monthTx().filter(t=>t.t==='out').reduce((s,t)=>s+t.amt,0);
const budLim=()=>S.budgets.reduce((s,b)=>s+b.lim,0);
const budSpent=()=>S.budgets.reduce((s,b)=>s+spentIn(b.cat),0);

function when(iso){const d=new Date(iso);const n=Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
 const tm=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
 return n===0?`Today, ${tm}`:n===1?`Yesterday, ${tm}`:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function dayLabel(iso){const d=new Date(iso);const n=Math.floor((new Date().setHours(0,0,0,0)-new Date(d).setHours(0,0,0,0))/864e5);
 return n===0?'Today':n===1?'Yesterday':d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

function txRow(t){

 return `<div class="bud"><div class="bud-top"><b>${b.cat}</b><span class="num">${fmt(sp,{dec:false})} of ${fmt(b.lim,{dec:false})}</span></div><div class="bar"><i class="${cls}" style="width:${p}%"></i></div></div>`}

function cashflowChart(){
 // last 4 weeks in vs out
 const W=[0,1,2,3].map(w=>{const tx=S.txns.filter(t=>{const a=(Date.now()-new Date(t.date))/864e5;return a>=w*7&&a<(w+1)*7});
  return {in:tx.filter(t=>t.t==='in').reduce((s,t)=>s+t.amt,0),out:tx.filter(t=>t.t==='out').reduce((s,t)=>s+t.amt,0)}}).reverse();
 const max=Math.max(...W.flatMap(w=>[w.in,w.out]),1);const top=Math.ceil(max/200000)*200000;
 const w=440,h=190,l=44,b=26,ch=h-b-10,cw=w-l-8;const g=cw/4;
 const y=v=>10+ch-(v/top)*ch;
 let s=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Money in and out by week">`;
 for(let i=0;i<=4;i++){const v=top*i/4;s+=`<line x1="${l}" x2="${w-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${short(v).replace('₦','')}</text>`}
 const labels=['3 wks ago','2 wks ago','Last week','This week'];
 W.forEach((d,i)=>{const x=l+g*i+g/2;const bw=16;
  s+=`<rect x="${x-bw-3}" y="${y(d.in)}" width="${bw}" height="${Math.max(0,10+ch-y(d.in))}" rx="5" fill="var(--blue)"/>`;
  s+=`<rect x="${x+3}" y="${y(d.out)}" width="${bw}" height="${Math.max(0,10+ch-y(d.out))}" rx="5" fill="var(--butter)"/>`;
  s+=`<text x="${x}" y="${h-6}" text-anchor="middle">${labels[i]}</text>`});
 return s+'</svg>'}

function nwChart(){

 const w=1000,h=300,l=52,r=16,t=16,b=28;const X=i=>l+(w-l-r)*i/(vals.length-1),Y=v=>t+(h-t-b)*(1-(v-lo)/(hi-lo));

 for(let v=lo;v<=hi;v+=500000)s+=`<line x1="${l}" x2="${w-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-8}" y="${Y(v)+4}" text-anchor="end">${short(v).replace('₦','')}</text>`;
 const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
 s+=`<polygon points="${l},${Y(lo)} ${pts} ${X(vals.length-1)},${Y(lo)}" fill="url(#nwg)"/><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
 vals.forEach((v,i)=>{s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${labels[i]}</text>`});

 s+=`<circle cx="${lx}" cy="${ly}" r="7" fill="var(--card)" stroke="var(--blue)" stroke-width="3"/>`;
 return s+'</svg>'}

 const byCat={};wk.filter(t=>t.t==='out').forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amt);

 const days=[...Array(7)].map((_,i)=>{const d=6-i;const a=S.txns.filter(t=>t.t==='out'&&Math.floor((new Date().setHours(0,0,0,0)-new Date(new Date(t.date)).setHours(0,0,0,0))/864e5)===d);return {d,v:a.reduce((s,t)=>s+t.amt,0),l:new Date(Date.now()-d*864e5).toLocaleDateString('en-GB',{weekday:'short'})}});
 const logged=days.filter(x=>x.v>0).length;const mx=Math.max(...days.map(x=>x.v),1);const topV=Math.ceil(mx/10000)*10000;

 [0,.5,1].forEach(f=>{const yy=10+ch*(1-f);ch_+=`<line x1="${l}" x2="${w-8}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${l-6}" y="${yy+4}" text-anchor="end">${Math.round(topV*f/1000)}k</text>`});
 days.forEach((x,i)=>{const bh=x.v/topV*ch,cx=l+g*i+g/2;ch_+=`<rect x="${cx-12}" y="${10+ch-bh}" width="24" height="${bh}" rx="6" fill="${i===6?'var(--blue)':'var(--blue-line)'}"/><text x="${cx}" y="${h-6}" text-anchor="middle">${x.l}</text>`});
 ch_+='</svg>';

  else document.getElementById('err').textContent='That email and password do not match. Use the demo account above.'});
 const sc=document.getElementById('screen');
 if(sc&&!sc.dataset.b){sc.dataset.b=1;sc.addEventListener('scroll',()=>{const t=sc.querySelector('.top');if(t)t.classList.toggle('scrolled',sc.scrollTop>4)},{passive:true})}
 const qi=document.getElementById('q');
 if(qi)qi.addEventListener('input',e=>{q=e.target.value;const pos=e.target.selectionStart;rerender();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)});
}

/* ---------------- toast ---------------- */
let tt;function toast(m){const t=document.getElementById('toast');if(!t)return;t.innerHTML=ic('check','sm')+esc(m);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------------- sheets ---------------- */
function openSheet(html,onMount){
 const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
 (document.getElementById('device')||document.body).appendChild(s);requestAnimationFrame(()=>s.classList.add('show'));
 const close=()=>{s.classList.remove('show');setTimeout(()=>s.remove(),200)};
 s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-close]'))close()});
 document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
 onMount&&onMount(s,close);
}
function addSheet(type){
 let t=type||'out',cat=t==='in'?'Salary':'Food',val='';
 const naira=S.accounts.filter(a=>a.kind!=='USD');
 const body=()=>`<div class="sheet-h"><h2>Add transaction</h2><button class="iconbtn" data-close aria-label="Close">${ic('x','sm')}</button></div>
  <div class="seg" role="group" aria-label="Type">${[['out','Money out'],['in','Money in'],['move','Move money']].map(([k,l])=>`<button type="button" data-t="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>
  <div class="amt-display" aria-live="polite"><span>₦</span><b id="amtShow" class="num ${val?'':'zero'}">${val?(+val).toLocaleString('en-NG'):'0'}</b></div>
  <div class="keypad" style="margin-bottom:18px" aria-label="Amount keypad">${['1','2','3','4','5','6','7','8','9','000','0','del'].map(k=>`<button type="button" data-k="${k}" aria-label="${k==='del'?'Delete digit':k}">${k==='del'?ic('chev','sm').replace('<svg','<svg style="transform:rotate(180deg)"'):k}</button>`).join('')}</div>
  <div class="form-stack">
   ${t==='move'?`<div class="grid2"><div class="field"><label for="from">From</label><select id="from" class="input">${naira.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div><div class="field"><label for="to">To</label><select id="to" class="input">${naira.map((a,i)=>`<option value="${a.id}" ${i===1?'selected':''}>${a.name}</option>`).join('')}</select></div></div>`
   :`<div class="field"><label>Category</label><div class="cats">${(t==='in'?INCATS:OUTCATS).map(c=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${c===cat}">${ic(CATS[c],'sm')}${c}</button>`).join('')}</div></div>
   <div class="field"><label for="acc">Account</label><select id="acc" class="input">${naira.map(a=>`<option value="${a.id}">${a.name} · ${fmt(a.bal,{dec:false})}</option>`).join('')}</select></div>`}
   <div class="field"><label for="note">Description <span class="note" style="font-weight:500">(optional)</span></label><input id="note" class="input" placeholder="${t==='in'?'Client payment':t==='move'?'Top up savings':'Lunch, fuel, data...'}" autocomplete="off"></div>
   <p class="err" id="aerr"></p>
   <button class="btn btn-blue btn-block" id="saveTx" type="button">Save</button>
  </div>`;
 openSheet('<div id="sb"></div>',(s,close)=>{
  const sb=s.querySelector('#sb');
  const paint=()=>{sb.innerHTML=body()};paint();
  const showAmt=()=>{const b=sb.querySelector('#amtShow');b.textContent=val?(+val).toLocaleString('en-NG'):'0';b.classList.toggle('zero',!val)};
  sb.addEventListener('click',e=>{
   const tb=e.target.closest('[data-t]');if(tb){t=tb.dataset.t;cat=t==='in'?'Salary':'Food';paint();return}
   const kb=e.target.closest('[data-k]');if(kb){const k=kb.dataset.k;if(k==='del')val=val.slice(0,-1);else if(val.length<10)val=(val+k).replace(/^0+/,'');showAmt();sb.querySelector('#aerr').textContent='';return}
   const cb=e.target.closest('[data-c]');if(cb){cat=cb.dataset.c;sb.querySelectorAll('[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===cat));return}
   if(e.target.closest('#saveTx')){
    const amt=+val;
    if(!amt||amt<=0){sb.querySelector('#aerr').textContent='Tap the numbers to enter an amount first.';return}
    const note=sb.querySelector('#note').value.trim();
    const tx={id:'t'+Date.now(),date:new Date().toISOString(),t,amt,cat:t==='move'?'Savings':cat,note:note||(t==='move'?'Moved money':cat)};
    if(t==='move'){tx.acct=sb.querySelector('#from').value;tx.to=sb.querySelector('#to').value;
     if(tx.acct===tx.to){sb.querySelector('#aerr').textContent='Pick two different accounts.';return}
     acct(tx.acct).bal-=amt;acct(tx.to).bal+=amt}
    else{tx.acct=sb.querySelector('#acc').value;acct(tx.acct).bal+=t==='in'?amt:-amt}
    S.txns.push(tx);save();close();rerender();
    const b=S.budgets.find(x=>x.cat===tx.cat);
    toast(t==='out'&&b?`Saved. ${tx.cat} is at ${Math.round(spentIn(b.cat)/b.lim*100)}% of budget`:'Saved');
   }
  });
  sb.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(/^\d$/.test(e.key)&&val.length<10){val=(val+e.key).replace(/^0+/,'');showAmt()}else if(e.key==='Backspace'){val=val.slice(0,-1);showAmt()}});
 });
}
function contribSheet(id){const g=S.goals.find(x=>x.id===id);
 openSheet(`<div class="sheet-h"><h2>Add to ${g.name}</h2><button class="iconbtn" data-close aria-label="Close">${ic('x','sm')}</button></div>
  <p class="note">${fmt(g.saved,{dec:false})} saved of ${fmt(g.target,{dec:false})}</p>
  <div class="amt-in"><span>₦</span><input id="camt" inputmode="numeric" placeholder="0" aria-label="Amount"></div>
  <div class="cats" style="justify-content:center;margin-bottom:18px">${[10000,25000,50000,100000].map(v=>`<button class="chip" data-v="${v}">${fmt(v,{dec:false})}</button>`).join('')}</div>
  <p class="err" id="cerr"></p><button class="btn btn-blue btn-block" id="csave">Add to goal</button>`,(s,close)=>{
  const inp=s.querySelector('#camt');setTimeout(()=>inp.focus(),60);
  const sz=()=>inp.style.width=Math.max(1.4,inp.value.length*.78+.3)+'ch';inp.addEventListener('input',()=>{const v=inp.value.replace(/[^\d]/g,'');inp.value=v?(+v).toLocaleString('en-NG'):'';sz()});
  s.addEventListener('click',e=>{const c=e.target.closest('[data-v]');if(c){inp.value=(+c.dataset.v).toLocaleString('en-NG');sz()}
   if(e.target.closest('#csave')){const v=+inp.value.replace(/[^\d]/g,'');if(!v){s.querySelector('#cerr').textContent='Enter an amount above zero.';return}
    g.saved=Math.min(g.target,g.saved+v);save();close();rerender();toast(`${g.name} is now ${Math.round(g.saved/g.target*100)}% funded`)}});
 })}
function notifBox(){
 const box=document.getElementById('notifBox');if(!box)return;
 if(box.innerHTML){box.innerHTML='';return}
 const a=S.budgets.find(b=>b.cat==='Airtime and data');
 box.innerHTML=`<div class="card notif"><div class="card-h pad" style="margin:0;padding-bottom:6px"><h2>Notifications</h2><span class="pill pill-blue">3 new</span></div><div class="list">
  <div class="row"><span class="ic" style="color:var(--warn)">${ic('pie','sm')}</span><div class="t"><b>Airtime and data at ${Math.round(spentIn(a.cat)/a.lim*100)}%</b><span>Budget line close to its limit</span></div></div>
  <div class="row"><span class="ic" style="color:var(--alert)">${ic('flame','sm')}</span><div class="t"><b>Keep your streak going</b><span>Chapter ${S.reading.current.at+1} is waiting</span></div></div>
  <div class="row"><a href="#review" style="display:contents"><span class="ic">${ic('review','sm')}</span><div class="t"><b>Your weekly review is ready</b><span>See what changed this week</span></div></a></div></div></div>`}

function txSheet(id){const t=S.txns.find(x=>x.id===id);if(!t)return;const d=new Date(t.date);
 const lines=[['Type',t.t==='in'?'Money in':t.t==='out'?'Money out':'Move money'],['Category',t.cat],['Account',t.t==='move'?`${acct(t.acct)?.name} to ${acct(t.to)?.name}`:acct(t.acct)?.name||''],['Date',d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})]];
 const b=t.t==='out'&&S.budgets.find(x=>x.cat===t.cat);
 openSheet(`<div class="sheet-h"><h2>${esc(t.note)}</h2><button class="iconbtn" data-close aria-label="Close">${ic('x','sm')}</button></div>
  <div style="text-align:center;padding:6px 0 18px"><span class="ic" style="width:56px;height:56px;margin:0 auto">${ic(t.t==='move'?'swap':t.t==='in'?'in':CATS[t.cat]||'wallet')}</span><p class="num" style="font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:10px;color:${t.t==='in'?'var(--pos)':'var(--ink)'}">${t.t==='in'?'+':t.t==='out'?'−':''}${fmt(t.amt)}</p></div>
  <div class="card list">${lines.map(([k,v])=>`<div class="row" style="justify-content:space-between"><span class="note" style="font-size:14px">${k}</span><b style="font-size:14px;text-align:right">${esc(v)}</b></div>`).join('')}</div>
  ${b?`<p class="note" style="margin-top:12px">${b.cat} budget: ${fmt(spentIn(b.cat),{dec:false})} of ${fmt(b.lim,{dec:false})} used this month.</p>`:''}
  <div id="delZone" style="margin-top:16px"><button class="btn btn-ghost btn-block" id="delAsk" style="color:var(--neg)">Delete transaction</button></div>`,(s,close)=>{
  s.addEventListener('click',e=>{
   if(e.target.closest('#delAsk')){s.querySelector('#delZone').innerHTML=`<p class="note" style="text-align:center;margin-bottom:10px">Delete this for good? Balances will update.</p><div class="grid2"><button class="btn btn-ghost" data-close>Keep it</button><button class="btn" id="delYes" style="background:var(--neg);color:#fff">Delete</button></div>`;return}
   if(e.target.closest('#delYes')){if(t.t==='move'){acct(t.acct).bal+=t.amt;acct(t.to).bal-=t.amt}else if(acct(t.acct)&&acct(t.acct).kind!=='USD'){acct(t.acct).bal+=t.t==='in'?-t.amt:t.amt}
    S.txns=S.txns.filter(x=>x.id!==id);save();close();rerender();toast('Transaction deleted')}});
 })}
function profileSheet(){
 openSheet(`<div class="sheet-h"><h2>Profile</h2><button class="iconbtn" data-close aria-label="Close">${ic('x','sm')}</button></div>
  <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><span class="avatar">EJ</span><div><b style="font-size:17px">${S.user.first} ${S.user.last}</b><p class="note">demo@myfin.app</p></div></div>
  <div class="card list">
   <div class="row"><span class="ic">${ic('users','sm')}</span><div class="t"><b>Your finances</b><span>Personal space · only you can see it</span></div><span class="pill pill-blue">Active</span></div>
   <button class="row" data-act="help" data-close><span class="ic">${ic('help','sm')}</span><div class="t"><b>Replay the tour</b><span>See where everything lives</span></div>${ic('chev','sm')}</button>
   <button class="row" data-act="reset" data-close><span class="ic">${ic('swap','sm')}</span><div class="t"><b>Reset sample data</b><span>Start the demo fresh</span></div>${ic('chev','sm')}</button>
   <button class="row" data-act="logout" data-close><span class="ic" style="color:var(--neg)">${ic('logout','sm')}</span><div class="t"><b>Log out</b><span>Back to the home page</span></div>${ic('chev','sm')}</button>
  </div>`)}

/* ---------------- first-run tour ---------------- */
const TOUR=[
 {sel:null,t:'Welcome to MyFin',b:'This quick tour shows you where everything lives. It takes about 30 seconds.'},
 {sel:'.bal',t:'Your net worth',b:'Everything you own minus everything you owe, in one number. Tap the eye to hide amounts when people are around.',home:1},
 {sel:'.strip',t:'Left to spend',b:"How much is left across this month's budgets. Tap View to see every line.",home:1},
 {sel:'.qa',t:'Log money in three taps',b:'Money out for spending, Money in for income, and Move money when you shift cash between your own accounts.',home:1},
 {sel:'.bnav .add',dsel:'.side-add',t:'Add from any screen',b:'The plus button opens the same quick add wherever you are.',db:'The Add transaction button opens the same quick add wherever you are.'},
 {sel:'.promo',t:'Small daily habits',b:'Challenges keep you consistent. Check in once a day to fill the bar.',home:1},
 {sel:'.bnav [data-tab=plan]',dsel:'.side a[href="#budgets"]',t:'Plan',b:'Budgets, savings goals, debts and your net worth trend live here.'},
 {sel:'.bnav [data-tab=grow]',dsel:'.side a[href="#challenges"]',t:'Grow',b:'Challenges, your reading streak and a weekly review in plain words.'},
 {sel:'#screen [data-act=help]',t:'Need this again?',b:'Tap the question mark at the top of any screen to replay this tour.'}];
let tourEl=null;
function endTour(){if(tourEl){tourEl.remove();tourEl=null}S.tourDone=true;save()}
function startTour(i){
 const dev=document.getElementById('device');if(!dev)return;
 if((location.hash||'').slice(1)!=='home'&&TOUR[i].home!==undefined||((location.hash||'').slice(1)!=='home'&&i===0)){location.hash='home';setTimeout(()=>startTour(i),420);return}
 if(!tourEl){tourEl=document.createElement('div');tourEl.className='tour';tourEl.setAttribute('role','dialog');tourEl.setAttribute('aria-modal','true');tourEl.setAttribute('aria-label','App tour');document.body.appendChild(tourEl)}
 const st=TOUR[i],last=i===TOUR.length-1;tourEl.dataset.i=i;
 const dots=`<div class="tour-dots">${TOUR.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
 const btns=`<div style="display:flex;gap:8px">${i>0?`<button class="btn btn-ghost btn-sm" data-tour="back">Back</button>`:''}<button class="btn btn-blue btn-sm" data-tour="${last?'done':'next'}">${last?'Got it':i===0?"Show me around":'Next'}</button></div>`;
 if(!st.sel){
  tourEl.innerHTML=`<div class="tour-spot" style="left:50%;top:50%;width:0;height:0"></div><div class="tour-hero"><div class="tour-card"><div class="wave">${MARK}</div><h3 style="font-size:22px">${st.t}, ${S.user.first}</h3><p>${st.b}</p><div class="tour-foot" style="justify-content:center;flex-direction:column;gap:12px">${dots}<div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" data-tour="done">Skip</button><button class="btn btn-blue btn-sm" data-tour="next">Show me around</button></div></div></div></div>`;
 }else{
  const D=isDesk();const target=document.querySelector(D&&st.dsel?st.dsel:st.sel);if(!target){return startTour(i+1<TOUR.length?i+1:i)}
  const sc=document.getElementById('screen');
  if(sc.contains(target)){const tr=target.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(tr.top<sr.top+90||tr.bottom>sr.bottom-110)sc.scrollTop+=tr.top-sr.top-130}
  const r=target.getBoundingClientRect();const pad=6;
  const box={l:r.left-pad,t:r.top-pad,w:r.width+pad*2,h:r.height+pad*2};
  const round=target.matches('.bnav .add,[data-act=help]')?'50%':target.matches('.bnav a,.side a,.side-add')?'16px':'26px';
  let spot=tourEl.querySelector('.tour-spot');if(!spot||tourEl.querySelector('.tour-hero')){tourEl.innerHTML='<div class="tour-spot"></div><div class="tour-card"></div>';spot=tourEl.querySelector('.tour-spot')}
  Object.assign(spot.style,{left:box.l+'px',top:box.t+'px',width:box.w+'px',height:box.h+'px',borderRadius:round});
  const card=tourEl.querySelector('.tour-card');
  card.innerHTML=`<span class="tour-step">${i} of ${TOUR.length-1}</span><h3>${st.t}</h3><p>${D&&st.db?st.db:st.b}</p><div class="tour-foot">${dots}${btns}</div>`;
  const W=innerWidth,H=innerHeight;const cw=D?380:W-32;card.style.width=cw+'px';const ch=card.offsetHeight||180;
  let L,T;
  if(D&&target.closest('.side')){L=box.l+box.w+18;T=Math.min(Math.max(12,box.t-20),H-ch-12)}
  else{L=D?Math.min(Math.max(16,box.l),W-cw-16):16;const below=box.t+box.h+14;T=below+ch<H-8?below:Math.max(12,box.t-ch-14)}
  card.style.left=L+'px';card.style.top=T+'px';
 }
 tourEl.onclick=e=>{const b=e.target.closest('[data-tour]');if(!b)return;const a=b.dataset.tour;
  if(a==='next')startTour(i+1);else if(a==='back')startTour(i-1);else{endTour();toast("You're all set. Tap + to add your first entry")}};
 tourEl.querySelector('[data-tour=next],[data-tour=done]')?.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if(tourEl&&e.key==='Escape')endTour()});
window.addEventListener('resize',()=>{if(tourEl&&tourEl.dataset.i)startTour(+tourEl.dataset.i)});

/* ---------------- actions ---------------- */
document.addEventListener('click',e=>{
 const sc=e.target.closest('[data-scroll]');if(sc){e.preventDefault();document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}
 const el=e.target.closest('[data-act]');
 if(!el){const nb=document.getElementById('notifBox');if(nb&&nb.innerHTML&&!e.target.closest('.notif'))nb.innerHTML='';return}
 const a=el.dataset.act;
 if(a==='hide'){S.hide=!S.hide;save();rerender()}
 else if(a==='add')addSheet(el.dataset.type);
 else if(a==='notif'){e.stopPropagation();notifBox()}
 else if(a==='filter'){filter=el.dataset.f;rerender()}
 else if(a==='checkin'){const c=S.challenges.active.find(x=>x.id===el.dataset.id);if(c&&!c.today){c.today=true;save();rerender();toast(c.done+1>=c.days?`${c.name} complete`:`Day ${c.done+1} done. ${c.days-c.done-1} to go`)}}
 else if(a==='start'){const C=S.challenges,i=C.available.findIndex(x=>x.id===el.dataset.id);if(i>-1){const c=C.available.splice(i,1)[0];C.active.push({...c,done:0,today:false});save();rerender();toast(`${c.name} started`)}}
 else if(a==='contrib')contribSheet(el.dataset.id);
 else if(a==='chapter'){const R=S.reading;if(!R.readToday){R.readToday=true;R.current.at=Math.min(R.current.chapters,R.current.at+1);save();rerender();toast(`Chapter ${R.current.at} done. ${R.streak+1} day streak`)}}
 else if(a==='saveanswer'){S.reading.answer=document.getElementById('answer').value;save();toast('Answer saved')}
 else if(a==='savereflect'){S.reflect=document.getElementById('reflect').value;save();toast('Reflection saved')}
 else if(a==='queue'){toast('Finish your current book first. It is queued next')}
 else if(a==='filldemo'){document.getElementById('email').value='demo@myfin.app';document.getElementById('pw').value='myfin2026';document.getElementById('err').textContent=''}
 else if(a==='logout'){endTour();authed=false;try{sessionStorage.removeItem('myfin-auth')}catch(_){};S=seed();save();location.hash='welcome'}
 else if(a==='reset'){S=seed();S.tourDone=true;save();filter='all';q='';rerender();toast('Sample data reset')}
 else if(a==='help'){setTimeout(()=>startTour(0),el.closest('.sheet')?260:0)}
 else if(a==='tx')txSheet(el.dataset.id);
 else if(a==='profile')profileSheet();
});

render();
})();
</script>
</body></html>
